 <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Library Books Converter</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    padding: 40px;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.1);
}

h1 {
    color: #2E5D50;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: #2E5D50;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #D4AF37;
    color: #222;
}

#message {
    margin-top: 25px;
    line-height: 1.6;
}

</style>

</head>


<body>


<div class="container">

<h1>📚 Library Books Converter</h1>

<p>
Select your exported Excel CSV file.
</p>

<input
    type="file"
    id="csvFile"
    accept=".csv"
>

<br>

<button onclick="convertFile()">
    Convert to Firebase JSON
</button>

<div id="message"></div>

</div>



<script>


function parseCSVLine(line, separator) {

    let result = [];

    let current = "";

    let insideQuotes = false;


    for (let i = 0; i < line.length; i++) {

        let char = line[i];


        if (char === '"') {

            if (
                insideQuotes &&
                line[i + 1] === '"'
            ) {

                current += '"';

                i++;

            } else {

                insideQuotes = !insideQuotes;

            }

        }

        else if (
            char === separator &&
            !insideQuotes
        ) {

            result.push(
                current.trim()
            );

            current = "";

        }

        else {

            current += char;

        }

    }


    result.push(
        current.trim()
    );


    return result;

}



function detectSeparator(line) {

    const separators = [",", ";", "\t"];

    let bestSeparator = ",";

    let bestCount = 0;


    separators.forEach(separator => {

        let columns =
            parseCSVLine(
                line,
                separator
            );


        if (columns.length > bestCount) {

            bestCount = columns.length;

            bestSeparator = separator;

        }

    });


    return bestSeparator;

}



function cleanValue(value) {

    return value
        .replace(/^"|"$/g, "")
        .trim();

}



function convertFile() {


    const fileInput =
        document.getElementById("csvFile");


    const message =
        document.getElementById("message");


    if (!fileInput.files.length) {

        message.innerHTML =
            "❌ Please select your CSV file.";

        return;

    }


    const file =
        fileInput.files[0];


    const reader =
        new FileReader();


    reader.onload = function(event) {


        try {


            let csv =
                event.target.result;


            // Remove BOM

            csv =
                csv.replace(/^\uFEFF/, "");


            // Normalize line endings

            csv =
                csv.replace(/\r\n/g, "\n");


            csv =
                csv.replace(/\r/g, "\n");


            const rows =
                csv
                .split("\n")
                .filter(row => row.trim() !== "");


            if (rows.length < 2) {

                message.innerHTML =
                    "❌ The CSV contains no data.";

                return;

            }


            // Detect separator

            const separator =
                detectSeparator(rows[0]);


            console.log(
                "Detected separator:",
                separator
            );


            // Read header

            const headers =
                parseCSVLine(
                    rows[0],
                    separator
                );


            console.log(
                "Headers:",
                headers
            );


            if (headers.length < 6) {

                message.innerHTML =

                    "❌ Only " +
                    headers.length +
                    " columns were detected.<br><br>" +

                    "Detected headers:<br>" +

                    headers.join("<br>");

                return;

            }


            const firebaseBooks = {};


            let count = 0;

            let skipped = 0;


            // ==================================
            // READ BOOKS
            // ==================================

            for (
                let i = 1;
                i < rows.length;
                i++
            ) {


                const columns =
                    parseCSVLine(
                        rows[i],
                        separator
                    );


                if (columns.length < 6) {

                    skipped++;

                    continue;

                }


                const record =
                    cleanValue(columns[0]);


                const callNumber =
                    cleanValue(columns[1]);


                const author =
                    cleanValue(columns[2]);


                const title =
                    cleanValue(columns[3]);


                const copyright =
                    cleanValue(columns[4]);


                const location =
                    cleanValue(columns[5]);


                // Skip empty rows

                if (
                    record === "" &&
                    callNumber === "" &&
                    author === "" &&
                    title === ""
                ) {

                    skipped++;

                    continue;

                }


                count++;


                const bookID =
                    "book" +
                    String(count)
                        .padStart(3, "0");


                firebaseBooks[bookID] = {

                    record: record,

                    callNumber: callNumber,

                    author: author,

                    title: title,

                    copyright: copyright,

                    location: location,

                    available: true

                };

            }


            if (count === 0) {

                message.innerHTML =

                    "❌ No books were detected.<br><br>" +

                    "Detected columns: " +

                    headers.length +
                    "<br><br>" +

                    headers.join(" | ");

                return;

            }


            // ==================================
            // CREATE JSON
            // ==================================

            const json =
                JSON.stringify(
                    firebaseBooks,
                    null,
                    2
                );


            const blob =
                new Blob(
                    [json],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = url;


            link.download =
                "books.json";


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            URL.revokeObjectURL(
                url
            );


            message.innerHTML =

                "✅ <strong>" +
                count +
                " books converted!</strong><br><br>" +

                "Skipped rows: " +
                skipped +
                "<br><br>" +

                "Firebase JSON downloaded as " +
                "<strong>books.json</strong>";


        }


        catch(error) {


            console.error(error);


            message.innerHTML =

                "❌ Error: " +
                error.message;

        }

    };


    reader.readAsText(file);

}

</script>


</body>

</html>
