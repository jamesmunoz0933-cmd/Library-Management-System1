<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Borrowed Books | Father Borromeo Library</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">

        <h2>
            📚 Father Borromeo Library
        </h2>

    </div>


    <nav>

        <ul>

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="books.html">
                    Browse Books
                </a>
            </li>

            <li>
                <a href="borrowed.html">
                    Borrowed Books
                </a>
            </li>

        </ul>

    </nav>

</header>



<!-- BORROWED BOOKS -->

<section class="library-section">


    <div class="page-title">

        <h1>
            🔴 Borrowed Books
        </h1>

        <p>
            View all books that are currently borrowed.
        </p>

    </div>



    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchBorrowed"
            placeholder="🔍 Search book or borrower..."
        >

    </div>



    <!-- TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Book Title</th>

                    <th>Borrower</th>

                    <th>Contact</th>

                    <th>Borrow Date</th>

                    <th>Due Date</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="borrowed-list">

                <tr>

                    <td
                        colspan="7"
                        class="loading"
                    >

                        📚 Loading borrowed books...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</section>



<!-- BACK TO ADMIN DASHBOARD -->

<div class="back-admin-container">

    <a
       href="admin.html"
        class="back-admin-btn"
    >
        ← Back to Admin Dashboard
    </a>

</div>



<!-- FOOTER -->

<footer>

    <p>
        © 2026 Father Borromeo Library
    </p>

</footer>



<!-- JAVASCRIPT -->

<script
    type="module"
    src="borrowed.js"
></script>


<style>

.back-admin-container {
    text-align: center;
    margin: 40px 0 25px;
}

.back-admin-btn {
    display: inline-block;
    padding: 12px 22px;
    background: #2E5D50;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
}

.back-admin-btn:hover {
    background: #244A40;
    text-decoration: none;
}

</style>


</body>

</html>
