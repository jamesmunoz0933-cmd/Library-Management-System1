<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Login | Father Borromeo Library</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ======================================
     ADMIN PIN LOGIN
     ====================================== -->

<section class="login-section">


    <div class="login-box">


        <div class="login-icon">
            📚
        </div>


        <h1>
            Father Borromeo Library
        </h1>


        <p>
            🔐 Admin Access
        </p>



        <!-- PIN FORM -->

        <form id="loginForm">


            <label for="pin">
                Admin PIN
            </label>


            <input
                type="password"
                id="pin"
                placeholder="Enter 6-digit PIN"
                inputmode="numeric"
                maxlength="6"
                pattern="[0-9]{6}"
                required
            >


            <button type="submit">

                🔐 Login

            </button>


            <p
                id="loginMessage"
                style="display: none;"
            ></p>


        </form>


        <br>


        <a href="index.html">
            ← Back to Library
        </a>


    </div>


</section>



<!-- ======================================
     LOGIN JAVASCRIPT
     ====================================== -->

<script
    src="login.js"
></script>


</body>

</html>
